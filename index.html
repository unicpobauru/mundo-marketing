<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mundo Marketing · UniCPO</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/portal.css">
<style>
.hero{background:var(--navy);color:var(--navy-ink)}
.hero .wrap{padding-block:40px 44px}
.hero .eyebrow{color:var(--navy-muted)}
.hero .lead{color:var(--navy-muted)}
.hero h1{max-width:20ch}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.quick a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;border-radius:10px;padding:10px 14px;background:rgba(255,255,255,.1);color:var(--navy-ink);border:1px solid rgba(255,255,255,.2)}
.quick a.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding-top:36px}
.home-cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:960px){.home-cols{grid-template-columns:minmax(0,1fr)}}
.grupo + .grupo{margin-top:30px}
.grupo h2{font-size:18px;margin-bottom:12px}
.novas{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.novas h2{font-size:18px;margin-bottom:12px}
.novas .mural{margin-left:4px}
.novas .post{padding-bottom:16px}
.novas .post h3{font-size:15px}
</style>
</head>
<body data-root="./" data-page="inicio">

<div class="hero"><div class="wrap">
  <div class="eyebrow" data-es="Portal del marketing · UniCPO">Portal do marketing · UniCPO</div>
  <h1 data-es="Todo lo que el marketing ya hizo, en un solo lugar">Tudo que o marketing já fez, num lugar só</h1>
  <p class="lead" data-es="Videos, guías, marca y materiales para el marketing y para los sectores Comercial, CS, Académico y Recepción.">Vídeos, guias, marca e materiais para o marketing e para os setores Comercial, CS, Acadêmico e Recepção.</p>
  <div class="quick">
    <a class="pri" href="videoteca/index.html" data-es="Abrir la Videoteca">Abrir a Videoteca</a>
    <a href="busca/index.html" data-es="Buscar en el portal">Buscar no portal</a>
    <a href="setores/index.html" data-es="Para tu sector">Para o seu setor</a>
  </div>
</div></div>

<main class="wrap">
  <div class="home-cols">
    <div id="areas"></div>
    <aside class="novas">
      <h2 data-es="Novedades">Novidades</h2>
      <div id="novas"></div>
      <a class="lbtn" href="area/index.html?id=mural" data-es="Ver el mural completo →">Ver o mural completo →</a>
    </aside>
  </div>
</main>

<script src="dados/areas.js"></script>
<script src="assets/portal.js"></script>
<script src="assets/colecao.js"></script>
<script>
(function(){
  var el = MM.el, L = MM.L;
  function areas(){
    var box = document.getElementById('areas'); box.textContent = '';
    MM.GRUPOS.forEach(function(g){
      var rs = MM.REGISTRO.filter(function(r){ return r.grupo === g.id; });
      if (!rs.length) return;
      box.appendChild(el('section', {class:'grupo'}, [
        el('h2', {text:L(g)}),
        el('div', {class:'grid'}, rs.map(function(r){
          return el('a', {class:'card', href:MM.hrefArea(r, '')}, [el('h3', {text:L(r.titulo)}), el('p', {text:L(r.descricao)}), el('span', {class:'go', text:(MM_LANG === 'es' ? 'Abrir' : 'Abrir') + ' →'})]);
        }))
      ]));
    });
  }
  var MURAL = null;
  function novas(){
    var box = document.getElementById('novas'); box.textContent = '';
    if (!MURAL) return;
    var ult = MURAL.itens.slice().sort(function(a,b){ return String(b.data).localeCompare(String(a.data)); }).slice(0, 4);
    box.appendChild(el('div', {class:'mural'}, ult.map(function(it){
      return el('article', {class:'post'}, [el('time', {text:MM.fmtData(it.data)}), el('h3', {}, [el('a', {href:'area/index.html?id=mural#' + it.id, text:L(it.titulo)})])]);
    })));
  }
  areas();
  MM.carregar(['dados/mural.js'], function(){ MURAL = MM._area; novas(); });
  document.addEventListener('mm:lang', function(){ areas(); novas(); });
})();
</script>
</body>
</html>
