<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Busca · Mundo Marketing</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../assets/portal.css">
</head>
<body data-root="../" data-page="busca">

<div class="wrap phead">
  <div class="eyebrow" data-es="Todo el portal">Portal inteiro</div>
  <h1 data-es="Búsqueda">Busca</h1>
  <p class="lead" data-es="Busca en todas las áreas del portal, en el Manual del Creativo y en los videos de la Videoteca.">Procura em todas as áreas do portal, no Manual do Criativo e nos vídeos da Videoteca.</p>
</div>

<main class="wrap">
  <section style="display:flex;flex-direction:column;gap:14px">
    <label class="searchbox" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Ex.: implantes Equador, CTA, visto, Valarelli" data-es-ph="Ej.: implantes Ecuador, CTA, visa, Valarelli">
    </label>
    <div id="meta" style="color:var(--muted);font-size:13.5px"></div>
    <div class="results" id="results"></div>
  </section>
</main>

<script src="../dados/areas.js"></script>
<script src="../assets/portal.js"></script>
<script src="../assets/colecao.js"></script>
<script>
(function(){
  var L = MM.L, norm = MM.norm, el = MM.el;
  var ES = function(){ return window.MM_LANG === 'es'; };
  // Seções do Manual (página própria, fora do motor de coleções)
  var MANUAL = [
    {t:{pt:'Princípios gerais',es:'Principios generales'}, u:'../manual/index.html#principios', x:'idioma espanhol neutro formato carisma duracao estrutura fatos plataformas regulamentacao incisao sangue'},
    {t:{pt:'Tipos de criativo',es:'Tipos de creativo'}, u:'../manual/index.html#tipos', x:'remarketing tradicional emocional landing youtube pais equador'},
    {t:{pt:'Temas para criativos tradicionais',es:'Temas para creativos tradicionales'}, u:'../manual/index.html#temas', x:'familia dinheiro trabalho corpo docente estrutura convalidado pacientes lingua distancia modular mec'},
    {t:'CTAs', u:'../manual/index.html#ctas', x:'cta formulario whatsapp mensagem chat'},
    {t:{pt:'Checklist antes de gravar',es:'Checklist antes de grabar'}, u:'../manual/index.html#checklist', x:'checklist gravar roteiro ab'}
  ];
  var IDX = [];   // {k (tipo), t, d, u, txt}
  MM.REGISTRO.forEach(function(r){
    IDX.push({k:{pt:'Área',es:'Área'}, t:r.titulo, d:r.descricao, u:MM.hrefArea(r, '../'), txt:norm(L(r.titulo) + ' ' + r.titulo.es + ' ' + L(r.descricao) + ' ' + r.descricao.es)});
  });
  MANUAL.forEach(function(m){ IDX.push({k:'Manual', t:m.t, u:m.u, txt:norm((m.t.pt || m.t) + ' ' + (m.t.es || '') + ' ' + m.x)}); });
  var VIDEOS = [];

  var q = document.getElementById('q'), out = document.getElementById('results'), meta = document.getElementById('meta');
  var pronto = false;
  function run(){
    var toks = norm(q.value).split(/\s+/).filter(function(t){ return t.length > 1; });
    out.textContent = '';
    if (!toks.length){ meta.textContent = ES() ? 'Escribe al menos una palabra.' : 'Digite pelo menos uma palavra.'; return; }
    var hit = function(txt){ return toks.every(function(t){ return txt.indexOf(t) >= 0; }); };
    var res = IDX.filter(function(x){ return hit(x.txt); });
    var vids = VIDEOS.filter(function(v){ return hit(v.txt); });
    res.forEach(function(x){
      var ext = /^https:/.test(x.u);
      out.appendChild(el('a', {class:'res', href:x.u, target:ext ? '_blank' : null, rel:ext ? 'noopener' : null}, [
        el('span', {class:'k', text:L(x.k)}), el('div', null, [el('b', {text:L(x.t)}), x.d ? el('span', {text:L(x.d)}) : null])]));
    });
    vids.slice(0, 30).forEach(function(v){
      out.appendChild(el('a', {class:'res', href:'../videoteca/index.html?q=' + encodeURIComponent('"' + v.v + '"')}, [
        el('span', {class:'k', text:ES() ? 'Video' : 'Vídeo'}), el('div', null, [el('b', {text:v.no}), el('span', {text:[v.t, v.c, v.pa].filter(Boolean).join(' · ')})])]));
    });
    if (vids.length > 30) out.appendChild(el('a', {class:'res', href:'../videoteca/index.html?q=' + encodeURIComponent(q.value.trim())}, [
      el('span', {class:'k', text:'+' + (vids.length - 30)}), el('div', null, [el('b', {text:ES() ? 'Ver todos los videos en la Videoteca' : 'Ver todos os vídeos na Videoteca'})])]));
    var total = res.length + vids.length;
    meta.textContent = !pronto ? (ES() ? 'Cargando contenido…' : 'Carregando conteúdo…')
      : (ES() ? total + ' resultado' + (total === 1 ? '' : 's') + ': ' + res.length + ' en el portal, ' + vids.length + ' videos'
              : total + ' resultado' + (total === 1 ? '' : 's') + ': ' + res.length + ' no portal, ' + vids.length + ' vídeos');
    if (!total && pronto) out.appendChild(el('div', {class:'empty', text:ES() ? 'Nada encontrado. Prueba con menos palabras.' : 'Nada encontrado. Tente usar menos palavras.'}));
  }

  // carrega o catálogo e depois cada área, uma por vez, guardando os itens no índice
  var areas = MM.REGISTRO.filter(function(r){ return !r.href || r.busca; });
  MM.carregar(['../videoteca/data.js'], function(){
    VIDEOS = ((window.CATALOGO && CATALOGO.items) || []).map(function(it){
      return {v:it.v, no:it.no, t:it.t, c:it.c, pa:it.pa, txt:norm([it.no,it.de,it.c,it.pa,it.p,it.qa,it.t,it.s,(it.ca||[]).join(' ')].join(' '))};
    });
    var i = 0;
    (function prox(){
      if (i >= areas.length){ pronto = true; run(); return; }
      var r = areas[i++]; MM._area = null;
      MM.carregar((r.extras || []).map(function(x){ return '../dados/' + x + '.js'; }).concat(['../dados/' + r.id + '.js']), function(){
        var def = MM._area;
        if (def) MM.itensDe(def).forEach(function(it){
          var t = it.titulo, d = it.resumo || it.texto;
          IDX.push({k:r.titulo, t:t, d:d, u:(r.href ? '../' + r.href : '../area/index.html?id=' + r.id) + (it.id ? '#' + it.id : ''),
            txt:norm([t && t.pt || t, t && t.es, d && d.pt || d, d && d.es, L(it.categoria)].concat((it.tags || []).map(L), (it.campos || []).map(function(c){ return L(c.valor); })).join(' '))});
        });
        prox();
      });
    })();
  });

  var tm = null;
  q.addEventListener('input', function(){ clearTimeout(tm); tm = setTimeout(run, 150); });
  document.addEventListener('mm:lang', run);
  var init = new URLSearchParams(location.search).get('q');
  if (init) q.value = init;
  run(); q.focus();
})();
</script>
</body>
</html>
